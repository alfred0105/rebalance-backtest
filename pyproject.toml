[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebalance-backtest"
version = "0.1.0"
description = "Backtest weekly momentum-tilted rebalancing with asymmetric entry/exit and transaction costs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rebalance-backtest = "rebalance_backtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
